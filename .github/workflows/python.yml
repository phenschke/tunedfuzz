# Python wheels (abi3, Python >= 3.10). Based on `maturin generate-ci github`.
# A tag publishes them to PyPI through trusted publishing.

name: Python

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-22.04, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: windows-latest, target: x64 }
          - { runner: windows-11-arm, target: aarch64 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --manifest-path python/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist
      - uses: astral-sh/setup-uv@v7
      - name: pytest
        if: ${{ matrix.manylinux != 'musllinux_1_2' }}
        shell: bash
        run: |
          uv venv
          uv pip install pytest numpy
          uv pip install tunedfuzz --no-index --no-deps --find-links dist
          if [ -d .venv/Scripts ]; then . .venv/Scripts/activate; else . .venv/bin/activate; fi
          pytest python/tests
      - name: pytest (musl)
        if: ${{ matrix.manylinux == 'musllinux_1_2' }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/io -w /io alpine:latest sh -c '
            apk add py3-pip py3-virtualenv && python3 -m virtualenv .venv && . .venv/bin/activate &&
            pip install pytest numpy && pip install tunedfuzz --no-index --no-deps --find-links dist &&
            pytest python/tests'

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: actions/attest@v4
        with:
          subject-path: wheels-*/*
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always wheels-*/*
